# Lighthouse on staging (the dev branch on staging.lifeatthenest.com).
#
# Runs:
#  - after every staging deploy (called by check.yml on a push to dev), and
#  - when a dev -> main PR is opened or reopened, so a new PR gets a report
#    without waiting for the next push.
# Results go to the run's summary and, if a dev -> main PR is open, to one
# sticky comment on it that's updated in place.
#
# A PR into main from dev points at a commit the push run already deployed
# and (usually) audited, so the PR-triggered run avoids repeating that:
#  - push run still in progress -> step aside; it comments when it finishes.
#  - push run done, with its report saved as an artifact (< 6 days old,
#    while the report links still work) -> post that report.
#  - otherwise (no push run, audit failed/skipped, too old) -> audit now.
# Runs queue rather than cancel each other.
name: Lighthouse (staging)

on:
  workflow_call:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  lighthouse:
    name: Lighthouse (staging)
    # Staging only ever shows dev, so other PRs into main are skipped.
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lighthouse-staging
      cancel-in-progress: false
    steps:
      - name: Decide whether to audit
        id: decide
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const short = sha.slice(0, 7);
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: "check.yml", head_sha: sha, event: "push",
            });
            const run = data.workflow_runs[0];
            if (run && run.status !== "completed") {
              core.notice(`"CI and Staging" #${run.run_number} is still deploying ${short} to staging; its Lighthouse job will comment on this PR.`);
              return core.setOutput("mode", "skip");
            }
            if (run) {
              const ageDays = (Date.now() - new Date(run.updated_at).getTime()) / 86400000;
              const { data: arts } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id, name: "lighthouse-report" });
              const art = arts.artifacts.find((a) => !a.expired);
              if (art && ageDays < 6) {
                core.notice(`Reusing the Lighthouse report from "CI and Staging" #${run.run_number} (${short}).`);
                core.setOutput("run_id", String(run.id));
                core.setOutput("run_number", String(run.run_number));
                return core.setOutput("mode", "reuse");
              }
            }
            if (!run) core.warning(`No "CI and Staging" push run found for ${short}; auditing whatever staging has now.`);
            else if (run.conclusion !== "success") core.warning(`"CI and Staging" for ${short} ended "${run.conclusion}"; auditing whatever staging has now.`);
            core.setOutput("mode", "audit");

      # ── Reuse the push run's report ──────────────────────────────────────
      - name: Download the push run's report
        if: steps.decide.outputs.mode == 'reuse'
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-report
          run-id: ${{ steps.decide.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reused

      - name: Use the push run's report
        if: steps.decide.outputs.mode == 'reuse'
        env:
          RUN_NUMBER: ${{ steps.decide.outputs.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.decide.outputs.run_id }}
        run: |
          { cat "$RUNNER_TEMP/reused/lighthouse.md"; echo; echo "_From the audit in [CI and Staging #$RUN_NUMBER]($RUN_URL), the push that deployed this commit._"; } > "$RUNNER_TEMP/lighthouse.md"
          cat "$RUNNER_TEMP/lighthouse.md" >> "$GITHUB_STEP_SUMMARY"

      # ── Or audit staging now ─────────────────────────────────────────────
      - uses: actions/checkout@v7
        if: steps.decide.outputs.mode == '' || steps.decide.outputs.mode == 'audit'

      # Median of 2 runs per page: single runs swing several points.
      # lighthouserc.staging.json skips "is-crawlable" (staging is noindex).
      - name: Run Lighthouse
        id: lighthouse
        if: steps.decide.outputs.mode == '' || steps.decide.outputs.mode == 'audit'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://staging.lifeatthenest.com/
            https://staging.lifeatthenest.com/posts
            https://staging.lifeatthenest.com/shop
            https://staging.lifeatthenest.com/recipes/homemade-granola
          runs: 2
          configPath: ./.github/lighthouse/lighthouserc.staging.json
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Write the report
        if: steps.decide.outputs.mode == '' || steps.decide.outputs.mode == 'audit'
        env:
          LIGHTHOUSE_LINKS: ${{ steps.lighthouse.outputs.links }}
          RESULTS: ${{ steps.lighthouse.outputs.resultsPath }}
        run: |
          node .github/lighthouse/report.mjs "$RESULTS" "🔦 Lighthouse report (staging)" > "$RUNNER_TEMP/lighthouse.md"
          cat "$RUNNER_TEMP/lighthouse.md" >> "$GITHUB_STEP_SUMMARY"

      # Saved so a PR opened later for this commit can post it instead of
      # auditing again. 7 days matches how long the report links last.
      - name: Save the report for reuse
        if: steps.decide.outputs.mode == '' || steps.decide.outputs.mode == 'audit'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ${{ runner.temp }}/lighthouse.md
          retention-days: 7

      # ── Post it ──────────────────────────────────────────────────────────
      # Looked up at the end, not the start, so a PR opened while the audit
      # was running still gets the comment.
      - name: Find the open dev → main PR
        id: pr
        if: steps.decide.outputs.mode != 'skip'
        uses: actions/github-script@v9
        with:
          script: |
            if (context.payload.pull_request) return core.setOutput("number", String(context.payload.pull_request.number));
            const { data } = await github.rest.pulls.list({
              ...context.repo, state: "open", base: "main", head: `${context.repo.owner}:dev`,
            });
            core.setOutput("number", data[0] ? String(data[0].number) : "");

      - name: Update the PR comment
        if: steps.decide.outputs.mode != 'skip' && steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: lighthouse
          number: ${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/lighthouse.md
